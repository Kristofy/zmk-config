# Kconfig options for both halves. Reference: https://zmk.dev/docs/config

# Deep sleep after 30 minutes without input (30 * 60 * 1000 ms).
# Any key press wakes the keyboard again.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Enables &soft_off (System layer, top left, hold 5 s).
# Only the reset button wakes the keyboard from soft off.
CONFIG_ZMK_PM_SOFT_OFF=y
