# Firmware the GitHub Actions build produces: one file per half, plus settings reset.
# Reference: https://zmk.dev/docs/user-setup#build-yaml
---
include:
  - board: nice_nano_v2
    shield: corne_left
  - board: nice_nano_v2
    shield: corne_right
  # Clears stored settings (e.g. Bluetooth pairings) when flashed; flash the
  # normal firmware again afterwards.
  - board: nice_nano_v2
    shield: settings_reset
